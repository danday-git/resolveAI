[project]
name = "resolveai-api"
version = "0.1.0"
description = "ResolveAI FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pypdf>=5.0",
    "PyJWT[crypto]>=2.9",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"app/services/llm/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
