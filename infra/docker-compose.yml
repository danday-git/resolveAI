services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - resolveai_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai -d resolveai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://resolveai:resolveai@db:5432/resolveai
      UPLOAD_DIR: /data/uploads
      INGEST_INLINE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - resolveai_uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10

  # Ingests uploads from the queue, retries failures and recovers interrupted documents.
  worker:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://resolveai:resolveai@db:5432/resolveai
      UPLOAD_DIR: /data/uploads
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - resolveai_uploads:/data/uploads
    restart: unless-stopped

  web:
    profiles: ["web"]
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Malware scanner for uploads. Opt in with `--profile scan` and CLAMAV_HOST=clamav in .env.
  # Needs about 2 GB of memory; the first start downloads the signature database.
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    volumes:
      - resolveai_clamav:/var/lib/clamav
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - resolveai_ollama:/root/.ollama

volumes:
  resolveai_db:
  resolveai_uploads:
  resolveai_ollama:
  resolveai_clamav:
