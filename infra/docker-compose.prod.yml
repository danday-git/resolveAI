# Production overlay: HTTPS at the edge, nothing else published.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#     --env-file .env --profile web up -d --build
#
# See docs/deployment.md.
services:
  caddy:
    image: caddy:2
    profiles: ["web"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - resolveai_caddy_data:/data
      - resolveai_caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  db:
    ports: !reset []
    restart: unless-stopped

  api:
    ports: !reset []
    environment:
      COOKIE_SECURE: "true"
      # Caddy replaces X-Forwarded-For with the real client address and the API is reachable
      # only through it, so the header can be trusted for per-client rate limits.
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped

  web:
    ports: !reset []
    restart: unless-stopped

volumes:
  resolveai_caddy_data:
  resolveai_caddy_config:
